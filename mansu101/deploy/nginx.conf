# MANSU101 — Nginx HTTPS template (manual certificates).
# Prefer the simpler flow: install nginx-http.conf, then run
#   sudo certbot --nginx -d your.domain
# which manages certificates and redirects for you.
#
# If you provision certificates manually (e.g. Cloudflare origin cert),
# install this file as /etc/nginx/sites-available/mansu101 and update paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mansu101_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mansu101.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mansu101.example.com;

    ssl_certificate     /etc/letsencrypt/live/mansu101.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mansu101.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /socket.io/ {
        proxy_pass http://mansu101_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://mansu101_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Optional VNC (see deploy/vnc-setup.sh). Rotate credentials.
    # location /vnc/ {
    #     auth_basic "MANSU101 remote desktop";
    #     auth_basic_user_file /etc/nginx/.htpasswd-mansu;
    #     proxy_pass http://127.0.0.1:6080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
}
