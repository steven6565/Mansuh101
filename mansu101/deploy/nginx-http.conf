# MANSU101 — bootstrap Nginx (HTTP). Run certbot afterwards for TLS.
# Install: sudo cp deploy/nginx-http.conf /etc/nginx/sites-available/mansu101
#          sudo ln -sf /etc/nginx/sites-available/mansu101 /etc/nginx/sites-enabled/mansu101
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo apt install certbot python3-certbot-nginx
#          sudo certbot --nginx -d YOUR_DOMAIN

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mansu101_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mansu101.example.com;   # <-- replace with your domain / VPS IP

    client_max_body_size 12m;

    # Security headers (TLS adds HSTS via certbot, then uncomment below)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /socket.io/ {
        proxy_pass http://mansu101_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://mansu101_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Optional: secure noVNC behind the same domain ─────────────────────
    # location /vnc/ {
    #     auth_basic "MANSU101 remote desktop";
    #     auth_basic_user_file /etc/nginx/.htpasswd-mansu;
    #     proxy_pass http://127.0.0.1:6080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
}
