# Optional: expose noVNC through Nginx at /vnc/
# 1. sudo apt install apache2-utils
# 2. sudo htpasswd -c /etc/nginx/.htpasswd-mansu YOUR_USER
# 3. Append this location block inside the MANSU101 server{} block.
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. Set VNC_URL=https://your.domain/vnc/vnc.html?autoconnect=1&resize=scale&path=vnc/websockify
#    (path= must point to the websocket endpoint below)

location /vnc/ {
    auth_basic "MANSU101 remote desktop";
    auth_basic_user_file /etc/nginx/.htpasswd-mansu;

    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# The noVNC client opens a WebSocket at /vnc/websockify (relative to the page).
# Nginx must upgrade that path as well — the location above handles it because
# websockify is served on the proxied root.
